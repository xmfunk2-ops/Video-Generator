name: Video Generator

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Foydalanuvchi rasmining havolasi (linki)'
        required: true
        default: 'https://example.com/image.jpg'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'ni yuklab olish
        uses: actions/checkout@v3

      - name: Python o'rnatish
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Foydalanuvchi rasmini yuklab olish
        run: |
          curl -L "${{ github.event.inputs.image_url }}" -o user_image.jpg

      - name: Python skriptini ishga tushirish (Render qilish)
        run: python process.py

      - name: Tayyor videoni saqlash (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: tayyor-video
          path: final_output.mp4
